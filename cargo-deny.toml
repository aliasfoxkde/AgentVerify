# cargo-deny configuration for AgentVerify
#
# See https://embarkstudios.github.io/cargo-deny/ for full documentation

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
]
copyleft = "deny"
exceptions = []

[advisories]
db-path = "https://github.com/rustsec/advisory-db"
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"
ignore = []

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
