name: CI

on:
  push:
    # `main-rewritten` is the staging branch for the coordinated history
    # rewrite; drop it once main has been swapped onto the rewritten history.
    branches: [main, main-rewritten]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 5
  RUSTUP_MAX_RETRIES: 5

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.features }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: default
            flags: --locked --workspace --all-targets
          - features: all-features
            flags: --locked --workspace --all-targets --all-features
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run clippy
        run: cargo clippy ${{ matrix.flags }} -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # Live services for the integration tests, which gate on
    # AGENTVERIFY_TEST_POSTGRES_URL / AGENTVERIFY_TEST_REDIS_URL and skip
    # cleanly when the variables are absent.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: agentverify
          POSTGRES_DB: agentverify_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AGENTVERIFY_TEST_POSTGRES_URL: postgres://postgres:agentverify@127.0.0.1:5433/agentverify_test
      AGENTVERIFY_TEST_REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        run: cargo test --locked --workspace
        env:
          RUSTFLAGS: -D warnings

      - name: Validate contract examples
        run: bash scripts/validate-contract-examples.sh

      - name: Compile benchmarks
        run: cargo bench --locked -p agentverify-engine --no-run

  doc:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: doc
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build documentation
        run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check declared MSRV (rust-version in Cargo.toml)
        run: cargo hack check --rust-version --locked --workspace

  deny:
    name: Deny (${{ matrix.checks }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  unused-deps:
    name: Unused dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete

      - name: Check for unused dependencies
        run: cargo-machete

  wasm:
    name: WASM (wasm32-wasip1)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check WASM-compatible crates
        run: >-
          cargo check --locked --target wasm32-wasip1
          -p agentverify-core
          -p agentverify-contract
          -p agentverify-engine
          -p agentverify-receipt
          -p agentverify-policy

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    # The same live services the Test job uses: the integration suites gate
    # on these variables and skip cleanly when they are absent, so without
    # them coverage would silently exclude the Postgres/Redis/MCP paths.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: agentverify
          POSTGRES_DB: agentverify_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AGENTVERIFY_TEST_POSTGRES_URL: postgres://postgres:agentverify@127.0.0.1:5433/agentverify_test
      AGENTVERIFY_TEST_REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate coverage report
        run: cargo llvm-cov --locked --workspace --all-features --codecov --output-path codecov.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: codecov.json
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
