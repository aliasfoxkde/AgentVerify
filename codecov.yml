codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        # Informational while the 90% core-crate target is being reached;
        # flip to enforcing once the baseline lands (see docs/ROADMAP.md).
        target: 90%
        informational: true
    patch:
      default:
        target: 90%
        informational: true

comment:
  layout: reach, diff, flags, files
  require_changes: false

github_checks:
  annotations: true
