[package]
name = "agentverify-cli"
description = "Command-line interface for AgentVerify contract validation and verification"
keywords = ["verification", "agents", "postconditions", "idempotency", "reliability"]
categories = ["development-tools", "development-tools::testing", "asynchronous"]
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true

# CLI binary only on non-WASM
[[bin]]
name = "agentverify"
path = "src/main.rs"

[dependencies]
agentverify-contract = { path = "../agentverify-contract" }
agentverify-core = { path = "../agentverify-core" }
agentverify-http = { path = "../agentverify-http" }
agentverify-runtime = { path = "../agentverify-runtime" }
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
