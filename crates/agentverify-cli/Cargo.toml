[package]
name = "agentverify-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

# CLI binary only on non-WASM
[[bin]]
name = "agentverify"
path = "src/main.rs"

[dependencies]
agentverify-contract = { path = "../agentverify-contract" }
agentverify-core = { path = "../agentverify-core" }
agentverify-http = { path = "../agentverify-http" }
agentverify-runtime = { path = "../agentverify-runtime" }
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["full"] }
