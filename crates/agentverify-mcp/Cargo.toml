[package]
name = "agentverify-mcp"
description = "Model Context Protocol (MCP) client integration for AgentVerify"
keywords = ["verification", "agents", "postconditions", "idempotency", "reliability"]
categories = ["development-tools", "development-tools::testing", "asynchronous"]
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Core
agentverify-core = { path = "../agentverify-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Async runtime
tokio = { version = "1.0", features = ["macros", "process", "io-util", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
# Tests drive the client with the multi-thread runtime, `#[tokio::test]`, and
# real subprocess peers, so the dev profile needs the same tokio features the
# library uses plus `macros`.
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
tokio-test = "0.4"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
