[package]
name = "agentverify-core"
description = "Core types for outcome verification: Action, Contract, Predicate, Receipt, and the verification state machine"
keywords = ["verification", "agents", "postconditions", "idempotency", "reliability"]
categories = ["development-tools", "development-tools::testing", "asynchronous"]
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
sha2 = { workspace = true }
hex = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.0", default-features = false, features = ["sync", "rt", "time", "macros"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[features]
default = []
std = []

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
