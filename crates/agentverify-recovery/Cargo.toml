[package]
name = "agentverify-recovery"
description = "Recovery strategies (retry, compensate, escalate) for failed verifications"
keywords = ["verification", "agents", "postconditions", "idempotency", "reliability"]
categories = ["development-tools", "development-tools::testing", "asynchronous"]
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agentverify-core = { path = "../agentverify-core" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync", "rt"] }
tracing.workspace = true

[dev-dependencies]
tokio-test.workspace = true

[package.metadata.docs.rs]
all-features = true
