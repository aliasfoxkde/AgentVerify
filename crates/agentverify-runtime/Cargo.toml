[package]
name = "agentverify-runtime"
description = "VerifiedExecutor: execute actions and verify outcomes against contracts"
keywords = ["verification", "agents", "postconditions", "idempotency", "reliability"]
categories = ["development-tools", "development-tools::testing", "asynchronous"]
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agentverify-core = { path = "../agentverify-core" }
agentverify-contract = { path = "../agentverify-contract" }
agentverify-engine = { path = "../agentverify-engine" }
thiserror.workspace = true
tracing.workspace = true
anyhow.workspace = true
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
chrono.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["full"] }
deadpool-redis = { version = "0.14", optional = true }
redis = { version = "1.6", features = ["tokio-comp", "connection-manager"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.0", default-features = false, features = ["sync", "rt", "time", "macros"] }

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
fs = []
redis = ["dep:deadpool-redis", "dep:redis"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
