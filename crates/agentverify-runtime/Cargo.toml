[package]
name = "agentverify-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agentverify-core = { path = "../agentverify-core" }
agentverify-contract = { path = "../agentverify-contract" }
agentverify-engine = { path = "../agentverify-engine" }
thiserror.workspace = true
anyhow.workspace = true
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
chrono.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.0", default-features = false, features = ["sync", "rt", "time", "macros"] }

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
fs = []
