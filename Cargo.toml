[workspace]
members = [
    "crates/agentverify-core",
    "crates/agentverify-contract",
    "crates/agentverify-engine",
    "crates/agentverify-runtime",
    "crates/agentverify-receipt",
    "crates/agentverify-recovery",
    "crates/agentverify-observe",
    "crates/agentverify-http",
    "crates/agentverify-cli",
    "crates/agentverify-testkit",
    "crates/agentverify-otel",
    "crates/agentverify-mcp",
    "crates/agentverify-storage",
    "crates/agentverify-policy",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Michael Kinney <aliasfoxkde@gmail.com>"]
license = "MIT"
repository = "https://github.com/aliasfoxkde/AgentVerify"
homepage = "https://github.com/aliasfoxkde/AgentVerify"
rust-version = "1.88"

# Strict, workspace-wide lints. Production code must not panic, unwrap,
# or print directly; tests opt out via cfg_attr(test, allow(...)).
# CI gates with `-D warnings`, so the `warn` levels below are enforced.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
exit = "deny"
# Pedantic is enforced (CI promotes warnings to errors).
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1.0", features = ["time", "sync", "rt", "macros"] }

# Web
# rustls-tls keeps the build free of a system OpenSSL dependency, which the
# musl and cross-compiled release targets cannot provide.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "json"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
deadpool = "0.12"
deadpool-redis = "0.14"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = "0.32"
prometheus = "0.13"

# Validation
regex = "1.0"
jsonpath-rust = "0.6"
cel-parser = "0.16"
url = "2.5"

# Crypto
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
signature = "2.0"
base64 = "0.22"
rand = "0.10"
sha2 = "0.10"
hex = "0.4"

# CLI
clap = { version = "4.0", features = ["derive", "cargo"] }
 inquire = "0.6"

# Testing
proptest = "1.0"
testcontainers = "1.0"
mockall = "0.12"
fuzz-utils = "0.1"
tempfile = "3.10"
tokio-test = "0.4"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

[profile.dev]
opt-level = 0
