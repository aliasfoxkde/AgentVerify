[workspace]
members = [
    "crates/agentverify-core",
    "crates/agentverify-contract",
    "crates/agentverify-engine",
    "crates/agentverify-runtime",
    "crates/agentverify-receipt",
    "crates/agentverify-http",
    "crates/agentverify-cli",
]
# Deferred placeholder crates (not yet implemented):
# - agentverify-observe: Observation adapters
# - agentverify-recovery: Recovery strategies
# - agentverify-policy: Policy engine
# - agentverify-storage: Storage adapters
# - agentverify-mcp: MCP integration
# - agentverify-otel: OpenTelemetry export
# - agentverify-testkit: Testing utilities

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AgentVerify Team"]
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Async
tokio = { version = "1.0", features = ["full"] }

# Web
reqwest = { version = "0.11", features = ["json"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "json"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.22"
opentelemetry_sdk = "0.22"
opentelemetry-otlp = "0.15"
prometheus = "0.13"

# Validation
regex = "1.0"
jsonpath-rust = "0.6"
cel-parser = "0.16"

# Crypto
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
signature = "2.0"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

# CLI
clap = { version = "4.0", features = ["derive", "cargo"] }
 inquire = "0.6"

# Testing
proptest = "1.0"
testcontainers = "1.0"
mockall = "0.12"
fuzz-utils = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

[profile.dev]
opt-level = 0
